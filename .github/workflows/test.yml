name: test

on:
  push:
    branches: [master]
  pull_request:

# Nothing is ever published by this workflow. The test image is built
# in-job, used, and discarded. So no packages: write, no registry, no
# credentials.
permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # No `submodules:` needed. libinjection, lua-aho-corasick and
      # lua-resty-htmlentities are vendored in-tree, so a plain checkout
      # is the whole build input.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7

      # Byte-for-byte the command a developer runs locally. CI gets no
      # special code path, which is what keeps "green in CI" and "green
      # on my machine" the same claim rather than two that happen to agree.
      #
      # Builds the pinned image, then runs all seven gates with the
      # network switched off.
      - name: Run the suite
        run: make test-docker
