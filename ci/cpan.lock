# One `Module@version` per line, in dependency order: cpanm installs the
# list left to right and skips a dependency that is already satisfied, so
# a leaf must come before anything requiring it. Pinning only the nine
# roots this project names left the other 35 on latest, which is what
# broke the first scheduled drift run.
#
# Not AUTHOR/Dist-Version.tar.gz: cpanm falls back to backpan for this
# form, and backpan keeps what CPAN mirrors prune.
#
# To re-resolve: edit, `make image`, read the cpanm output. The build
# asserts the installed closure still matches this file.

